# Local Java/React development shares the full stack's dependencies and volumes.
# Start with: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  minio:
    extends:
      file: docker-compose.yml
      service: minio

  createbuckets:
    extends:
      file: docker-compose.yml
      service: createbuckets

volumes:
  postgres_data:
  redis_data:
  minio_data:
